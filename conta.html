<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://googleapis.com"/>
</head>
<body data-tema="claro">
    <header>
        <div class="logo">
            <h2>Sua Conta</h2>
            <p>Aqui você encontra as informações sobre a sua conta!</p>
        </div>

        <button id="botaoModoEscuro">
            <img src="imagens/imgModoEscuro.png" alt="Botão para ativar o modo escuro">
        </button>

        <a href="index.html" id="voltar">&larr; voltar</a>
    </header>

    <main id="paginaConta">
        <div id="informacoesConta">
    <!-- Foto de perfil na esquerda -->
    <img src="imagens/icone-perfil.png" alt="Foto de perfil" id="pfp">
    
    <!-- Bloco de textos empilhados organizadamente -->
    <div id="textos">
        <div class="linha-info">
            <span class="rotulo">Nome:</span>
            <span id="nomeUsuario" class="valor-info">Seu Nome</span>
        </div>
        
        <div class="linha-info">
            <span class="rotulo">Arroba:</span>
            <span id="arrobaUsuario" class="valor-info">@seuusuario</span>
        </div>
        
        <div class="linha-info">
            <span class="rotulo">Biografia:</span>
            <span id="biografiaUsuario" class="valor-info"><i>Escreva sua biografia aqui!</i></span>
        </div>
    </div>
</div>

        <div id="estatisticasConta">
            <h2>Estatísticas</h2>
            <p>Dinheiro: <span id="dinheiroAtual">0</span></p>
            <p>Cliques: <span id="totalGerNum">0</span></p>
            <p>Multiplicador: <span id="totalMultiplicador">1</span>x</p>
        </div>
    </main>

    <script src="scriptIndex.js"></script>
</body>
</html>
