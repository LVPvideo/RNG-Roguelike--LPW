<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conta</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://googleapis.com"/>
    <link rel="shortcut icon" href="imagens/icone-perfil.png" type="image/x-icon">
</head>
<body data-tema="claro">
    <header>
        <div class="logo">
            <h2>Sua Conta</h2>
            <p>Aqui você encontra as informações sobre a sua conta!</p>
        </div>

        <button id="botaoModoEscuro">
            <img src="imagens/imgModoEscuro.png" alt="Botão para ativar o modo escuro">
        </button>

        <a href="index.html" id="voltar">&larr; voltar</a>
    </header>

    <main id="paginaConta">
    <div id="informacoesConta">
        
        <div class="container-foto">
            <img src="imagens/icone-perfil.png" alt="Foto de perfil" id="pfp">
            <input type="file" id="inputFoto" accept="image/*" style="display: none;">
            <button id="botaoTrocarFoto" class="btn-acao">Mudar Foto</button>
        </div>
        
        <div id="textos">
            
            <div id="modoVisualizacao">
                <div class="linha-info">
                    <span class="rotulo">Nome:</span>
                    <span id="visorNome" class="valor-info">Nome</span>
                </div>
                <div class="linha-info">
                    <span class="rotulo">Arroba:</span>
                    <span id="visorArroba" class="valor-info">@arroba</span>
                </div>
                <div class="linha-info">
                    <span class="rotulo">Biografia:</span>
                    <span id="visorBio" class="valor-info">Escreva sua biografia aqui!</span>
                </div>
                <button id="botaoEditar" class="btn-acao" style="margin-top: 10px;">Editar Perfil</button>
            </div>

           
            <div id="modoEdicao" style="display: none;">
                <div class="linha-info">
                    <span class="rotulo">Nome:</span>
                    <input type="text" id="inputNome" class="campo-input">
                </div>
                <div class="linha-info">
                    <span class="rotulo">Arroba:</span>
                    <input type="text" id="inputArroba" class="campo-input">
                </div>
                <div class="linha-info">
                    <span class="rotulo">Biografia:</span>
                    <textarea id="inputBio" class="campo-input"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button id="botaoSalvar" class="btn-acao">Salvar</button>
                    <button id="botaoCancelar" class="btn-acao" style="background-color: var(--texto-suave);">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="estatisticasConta">
        <h2>Estatísticas</h2>
        <p>Dinheiro: <span id="dinheiroAtual">0</span></p>
        <p>Cliques: <span id="totalGerNum">0</span></p>
        <p>Multiplicador: <span id="totalMultiplicador">1</span>x</p>
    </div>
</main>

    <script src="scriptIndex.js"></script>
    <script src="conta.js"></script>
</body>
</html>
