<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalização</title>
    <link rel="stylesheet" href="personalizacao.css">
    
</head>
<body>
    <header>
         <a href="index.html" id="voltar">&larr; voltar</a>
        
        <div class="cabecalho">
            <h1>Personalize aqui seu peixe!</h1> 
            
        </div>

        <button id="botaoModoEscuro">
            <img src="imagens/imgModoEscuro.png" alt="Botao para ativar o Modo escuro ">
        </button>

       
        
        
    </header>

    <div class = "elementos">
        <div id = "vizualPeixe">
            <h2>Seu peixinho</h2>
            <div id="areaPeixe">
                <img id="peixe" src="imagens/peixe.png" alt="Peixe">
                    
                <img id="acessorioEquipado" alt="" hidden>
            </div>

            
        </div>

        

        <div id = "personalizacaoPeixe">

            <div class="opcoesPersonalizacao">

            <button id="botaoAcessorios" class="opcaoPersonalizacao" type="button">
                Acessórios
            </button>

            <button class="opcaoPersonalizacao" type="button">
                Cor
                <input type="color" id="seletorCor" value="#52bdff">
            </button>

            

            <button class="opcaoPersonalizacao" type="button">
                Fundo
            </button>

        </div>
        <section id="loja">
                <p>
                    Suas moedas:
                    <strong id="saldoMoedas">0</strong>
                </p>

                <div id="itensLoja"></div>

                <p id="mensagemLoja"></p>
            </section>  
        
    </div>

     <div id="botoesSalvar">
            <button id="botaoSalvarAvatar">Salvar avatar!</button>
        </div>


    <script src="personalizacao.js"></script>
</body>
</html>
