<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking | RNGuelike</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="ranking.css">
</head>
<body>
    <header>
        <div class="logo">
            <h2>Ranking</h2>
            <p>Os maiores sortudos do fundo do mar!</p>
        </div>

        <button id="botaoModoEscuro">
            <img src="imagens/imgModoEscuro.png" alt="Botão para ativar o modo escuro">
        </button>

        <a href="index.html" id="voltar">&larr; voltar</a>
    </header>

    <main class="paginaRanking">
        <section class="painelRegistro" aria-labelledby="tituloRegistro">
            <h2 id="tituloRegistro">Registrar pontuação</h2>

            <form id="formRegistro">
                <label for="campoNome">Seu nome</label>
                <input type="text" id="campoNome" maxlength="20" autocomplete="nickname" placeholder="Ex.: Peixe Sortudo">

                <p class="pontosAtuais">
                    Seus pontos agora:
                    <strong id="pontosAtuais">0</strong>
                </p>

                <button type="submit" id="botaoRegistrar">Registrar no ranking</button>
                <p id="mensagemFormulario" role="status"></p>
            </form>
        </section>
        <section class="painelRanking" aria-labelledby="tituloRanking">
            <h2 id="tituloRanking">Classificação</h2>
            <ol id="listaRanking"></ol>
            <p id="mensagemVazio">Ninguém no ranking ainda. Seja o primeiro!</p>
        </section>
    </main>
    <script src="ranking.js"></script> 
</body>
</html>
